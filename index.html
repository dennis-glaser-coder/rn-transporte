.hero.missing{background:linear-gradient(135deg,#2c2c2e,#181818)}.hero.missing:before{content:"ORIGINALFOTO RN";position:absolute;inset:0;display:grid;place-items:center;color:#858585;font-size:13px;font-weight:800;letter-spacing:.18em;z-index:1}.hero.missing:after{background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.45))}

footer{background:var(--soft);border-top:1px solid var(--line);padding:16px 0;font-size:11px;color:#8a8a8a}.foot{display:flex;align-items:center;justify-content:space-between;gap:24px}.foot a{color:var(--ink);font-weight:650}
