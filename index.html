footer{background:var(--soft);border-top:1px solid var(--line);padding:16px 0}.foot{display:flex;align-items:center;justify-content:space-between;gap:22px;font-size:11px;color:#8d8d8d}.foot-links{display:flex;gap:18px}.foot a{color:#575757;font-weight:650}
