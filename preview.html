<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RN Transporte – Vorschau</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="site" src="./index.html" title="RN Transporte Vorschau"></iframe>
<script>
(function(){
  const frame=document.getElementById('site');
  function fix(){
    try{
      const d=frame.contentDocument;
      if(!d) return;
      let s=d.getElementById('preview-force-visible');
      if(!s){
        s=d.createElement('style');
        s.id='preview-force-visible';
        s.textContent='.reveal{opacity:1!important;transform:none!important;transition:none!important}';
        d.head.appendChild(s);
      }
      d.querySelectorAll('.reveal').forEach(el=>{el.classList.add('show','is-visible');el.style.opacity='1';el.style.transform='none';});
    }catch(e){}
  }
  frame.addEventListener('load',()=>{fix();setTimeout(fix,200);setTimeout(fix,800);});
  setInterval(fix,1200);
})();
</script>
</body>
</html>
