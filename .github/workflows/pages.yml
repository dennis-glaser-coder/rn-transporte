name: Deploy RN Transporte to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build RN hero image
        run: |
          cat assets/rn-hero-clean/01.b64 assets/rn-hero-clean/02.b64 assets/rn-hero-clean/03.b64 assets/rn-hero-clean/04.b64 | base64 -d > assets/rn-hero.webp
          test "$(stat -c%s assets/rn-hero.webp)" -gt 50000

      - name: Bust hero cache
        run: sed -i "s#assets/rn-hero.webp#assets/rn-hero.webp?v=${GITHUB_SHA}#g" index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
