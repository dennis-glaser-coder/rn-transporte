name: Deploy RN Transporte to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build RN multipage site
        run: python build.py

      - name: Apply RN postbuild refinements
        run: python postbuild.py

      - name: Add Kiestransporte image
        run: python kies_image.py

      - name: Add homepage email contact
        run: python hero_email.py

      - name: Verify RN multipage site
        run: |
          test -f rn_hero_final.png
          test -f assets/logo.webp
          test -f assets/premium.css
          test -f assets/favicon-rn.svg
          test -f assets/leistungen/betonpumpendienst.png
          test -f assets/leistungen/frischbetontransport.png
          test -f assets/leistungen/Kiestransporte.png
          test -f kies_image.py
          test -f hero_email.py
          test -f index.html
          test -f leistungen.html
          test -f unternehmen.html
          test -f karriere.html
          test -f kontakt.html
          test -f robots.txt
          test -f sitemap.xml

          grep -q 'src="rn_hero_final.png"' index.html
          grep -q '>MENÜ<' index.html
          grep -q 'id="rn-mobile-menu-fix"' index.html
          grep -q 'id="rn-hero-email-style"' index.html
          grep -q '<a href="tel:+491737275165">Anrufen</a>' index.html
          ! grep -q '<a href="tel:+491737275165">0173 72 75 165</a>' index.html
          grep -q 'class="hero-email" href="mailto:ntorwesten@web.de" aria-label="E-Mail schreiben"' index.html
          grep -q '<rect x="3" y="5" width="18" height="14"' index.html
          ! grep -q '>ntorwesten@web.de</a>' index.html
          grep -q 'assets/premium.css?v=89' index.html
          grep -q 'Alles Wichtige auf einen Blick.' index.html
          ! grep -q 'Direkt zum passenden Bereich.' index.html
          ! grep -Eq '<span>0[1-4]</span>' index.html

          grep -q 'aria-current="page">Leistungen</a>' leistungen.html
          grep -q 'id="rn-service-editorial-style"' leistungen.html
          grep -q 'id="rn-kies-image-style"' leistungen.html
          grep -q 'assets/leistungen/betonpumpendienst.png' leistungen.html
          grep -q 'assets/leistungen/frischbetontransport.png' leistungen.html
          grep -q 'assets/leistungen/Kiestransporte.png' leistungen.html
          grep -q 'alt="RN Transporte Kiestransport im Einsatz"' leistungen.html
          grep -q 'filter:saturate(.84)' leistungen.html
          grep -q '<h2>Kiestransporte</h2>' leistungen.html
          ! grep -q 'class="service-text-row"' leistungen.html
          ! grep -q 'Baustelleneinsatz.png' leistungen.html

          grep -q 'aria-current="page">Unternehmen</a>' unternehmen.html
          grep -q 'aria-current="page">Karriere</a>' karriere.html
          grep -q 'aria-current="page">Kontakt</a>' kontakt.html
          grep -q 'id="rn-mobile-menu-fix"' kontakt.html
          grep -q 'id="rn-contact-email-style"' kontakt.html
          grep -q 'mailto:ntorwesten@web.de' kontakt.html
          grep -q '>ntorwesten@web.de</a>' kontakt.html
          grep -q 'E-Mail →' kontakt.html
          grep -q '0173 72 75 165' kontakt.html
          grep -q 'Lohweg 55a' kontakt.html

          grep -q 'Seit 2010 steht RN Transporte' unternehmen.html
          grep -q 'Pumpenfahrer / Betonpumpenmaschinist' karriere.html
          grep -q '<span>C/CE</span>' karriere.html

          grep -q 'Sitemap: https://dennis-glaser-coder.github.io/rn-transporte/sitemap.xml' robots.txt
          grep -q 'noindex,follow' impressum.html
          grep -q 'noindex,follow' datenschutz.html
          grep -q 'DE 270004353' impressum.html
          grep -q 'HRB 9694' impressum.html
          grep -q 'Amtsgericht Paderborn' impressum.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
