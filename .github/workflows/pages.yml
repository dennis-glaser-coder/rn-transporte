name: Deploy RN Transporte to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build RN multipage site
        run: python build.py

      - name: Refine homepage overview
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace("Direkt zum passenden Bereich.", "Alles Wichtige auf einen Blick.")
          for number in ("01", "02", "03", "04"):
              html = html.replace(f"<span>{number}</span>", "")
          page.write_text(html, encoding="utf-8")

          css_path = Path("assets/premium.css")
          css = css_path.read_text(encoding="utf-8")
          css = css.replace(
              ".home-link-card h3{margin:48px 0 0;color:var(--ink);",
              ".home-link-card h3{margin:0;color:var(--ink);",
          )
          css = css.replace(
              ".home-link-card h3{margin-top:32px;font-size:27px}",
              ".home-link-card h3{margin-top:0;font-size:27px}",
          )
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Verify RN multipage site
        run: |
          test -f rn_hero_final.png
          test -f assets/logo.webp
          test -f assets/premium.css
          test -f assets/favicon-rn.svg
          test -f index.html
          test -f leistungen.html
          test -f unternehmen.html
          test -f karriere.html
          test -f kontakt.html
          test -f robots.txt
          test -f sitemap.xml

          grep -q 'src="rn_hero_final.png"' index.html
          grep -q '>MENÜ<' index.html
          grep -q 'href="index.html" class="active" aria-current="page">Startseite</a>' index.html
          grep -q 'href="leistungen.html"' index.html
          grep -q 'href="unternehmen.html"' index.html
          grep -q 'href="karriere.html"' index.html
          grep -q 'href="kontakt.html"' index.html
          grep -q 'class="mobile-project-link"' index.html
          grep -q 'class="header-cta" href="kontakt.html"' index.html
          grep -q 'href="assets/favicon-rn.svg"' index.html
          grep -q 'Alles Wichtige auf einen Blick.' index.html
          ! grep -q 'Direkt zum passenden Bereich.' index.html
          ! grep -Eq '<span>0[1-4]</span>' index.html
          ! grep -q 'id="unternehmen"' index.html
          ! grep -q 'id="karriere"' index.html

          grep -q 'aria-current="page">Leistungen</a>' leistungen.html
          grep -q 'Betonpumpendienst' leistungen.html
          grep -q 'Frischbetontransporte' leistungen.html
          grep -q 'Kiestransporte' leistungen.html

          grep -q 'aria-current="page">Unternehmen</a>' unternehmen.html
          grep -q 'Seit 2010 steht RN Transporte' unternehmen.html
          grep -q 'Holztransporte' unternehmen.html

          grep -q 'aria-current="page">Karriere</a>' karriere.html
          grep -q 'Pumpenfahrer / Betonpumpenmaschinist' karriere.html
          grep -q '<span>C/CE</span>' karriere.html
          grep -q 'Berufskraftfahrer' karriere.html

          grep -q 'aria-current="page">Kontakt</a>' kontakt.html
          grep -q '0173 72 75 165' kontakt.html
          grep -q 'Lohweg 55a' kontakt.html
          grep -q 'WhatsApp' kontakt.html

          grep -q '<link rel="canonical" href="https://dennis-glaser-coder.github.io/rn-transporte/">' index.html
          grep -q '<link rel="canonical" href="https://dennis-glaser-coder.github.io/rn-transporte/leistungen.html">' leistungen.html
          grep -q '<link rel="canonical" href="https://dennis-glaser-coder.github.io/rn-transporte/unternehmen.html">' unternehmen.html
          grep -q '<link rel="canonical" href="https://dennis-glaser-coder.github.io/rn-transporte/karriere.html">' karriere.html
          grep -q '<link rel="canonical" href="https://dennis-glaser-coder.github.io/rn-transporte/kontakt.html">' kontakt.html

          grep -q 'Sitemap: https://dennis-glaser-coder.github.io/rn-transporte/sitemap.xml' robots.txt
          grep -q '<loc>https://dennis-glaser-coder.github.io/rn-transporte/leistungen.html</loc>' sitemap.xml
          grep -q '<loc>https://dennis-glaser-coder.github.io/rn-transporte/unternehmen.html</loc>' sitemap.xml
          grep -q '<loc>https://dennis-glaser-coder.github.io/rn-transporte/karriere.html</loc>' sitemap.xml
          grep -q '<loc>https://dennis-glaser-coder.github.io/rn-transporte/kontakt.html</loc>' sitemap.xml

          grep -q 'noindex,follow' impressum.html
          grep -q 'noindex,follow' datenschutz.html
          grep -q 'href="assets/favicon-rn.svg"' impressum.html
          grep -q 'href="assets/favicon-rn.svg"' datenschutz.html
          grep -q 'DE 270004353' impressum.html
          grep -q 'HRB 9694' impressum.html
          grep -q 'Amtsgericht Paderborn' impressum.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
