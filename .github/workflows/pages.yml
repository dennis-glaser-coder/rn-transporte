name: Deploy RN Transporte to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build RN premium site
        run: python build.py

      - name: Verify RN premium site
        run: |
          test -f rn_hero_final.png
          test -f assets/logo.webp
          test -f assets/premium.css
          test -f robots.txt
          test -f sitemap.xml
          grep -q 'src="rn_hero_final.png"' index.html
          grep -q 'src="assets/logo.webp"' index.html
          grep -q 'RN Transporte – zuverlässig. leistungsstark. deutschlandweit im Einsatz.' index.html
          grep -q 'Seit 2010 steht RN Transporte' index.html
          grep -q 'Holztransporte' index.html
          grep -q 'Karriere bei RN Transporte' index.html
          grep -q '<span>C/CE</span>' index.html
          grep -q 'Projekt oder Einsatz anfragen.' index.html
          grep -q 'Salzkotten · bundesweit im Einsatz' index.html
          grep -q '<a class="header-cta" href="#kontakt">Projekt anfragen</a>' index.html
          ! grep -q 'class="phone"' index.html
          ! grep -q 'Stelle 01' index.html
          ! grep -q 'Stelle 02' index.html
          grep -q '<link rel="canonical" href="https://dennis-glaser-coder.github.io/rn-transporte/">' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'RN Torwesten Transporte UG (haftungsbeschränkt)' index.html
          grep -q 'og:image' index.html
          grep -q 'Sitemap: https://dennis-glaser-coder.github.io/rn-transporte/sitemap.xml' robots.txt
          grep -q '<loc>https://dennis-glaser-coder.github.io/rn-transporte/</loc>' sitemap.xml
          grep -q 'noindex,follow' impressum.html
          grep -q 'noindex,follow' datenschutz.html
          grep -q 'DE 270004353' impressum.html
          grep -q 'HRB 9694' impressum.html
          grep -q 'Amtsgericht Paderborn' impressum.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
