name: Deploy RN Transporte to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build RN premium presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected {label} not found")
              return text.replace(old, new, 1)

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          replacements = [
              ('</head>', '<link rel="stylesheet" href="assets/premium.css">\n</head>', 'premium stylesheet hook'),
              ('src="assets/logo.svg"', 'src="assets/logo.webp"', 'real logo image'),
              ('<a class="phone" href="tel:+491737275165">0173 72 75 165</a>', '<a class="phone" href="tel:+491737275165">0173 72 75 165</a><a class="header-cta" href="#kontakt">Projekt anfragen</a>', 'header CTA'),
              ('<div class="hero-place">Salzkotten-Niederntudorf</div>', '<div class="hero-place">Salzkotten-Niederntudorf · Deutschlandweit</div>', 'hero location'),
              ('<h1 class="hero-title">Betonpumpendienst, Frischbetontransporte und Kiestransporte.</h1>', '<h1 class="hero-title">Betonlogistik und Transport. Zuverlässig im Einsatz.</h1><p class="hero-sub">Betonpumpendienst, Frischbeton- und Kiestransporte für Baustellen und Betonwerke.</p><div class="hero-cta-row"><a class="hero-cta" href="#kontakt">Projekt anfragen</a></div>', 'premium hero copy'),
              ('<div class="job-kicker">Stelle 01</div>', '', 'career label 01'),
              ('<div class="job-kicker">Stelle 02</div>', '', 'career label 02'),
              ('<h2>Einsatz besprechen.</h2>', '<h2>Ihr nächster Einsatz beginnt mit einem kurzen Gespräch.</h2><p class="contact-copy">Betonpumpendienst oder Transportbedarf? Rufen Sie direkt an oder senden Sie uns Ihre Anfrage per WhatsApp.</p>', 'premium contact copy'),
          ]

          for old, new, label in replacements:
              s = replace_once(s, old, new, label)

          if 'src="rn_hero_final.png"' not in s:
              raise SystemExit("Final hero image reference changed unexpectedly")
          if 'src="assets/logo.webp"' not in s:
              raise SystemExit("Real logo image reference missing")
          if 'href="assets/premium.css"' not in s:
              raise SystemExit("Premium stylesheet missing")
          if 'Stelle 01' in s or 'Stelle 02' in s:
              raise SystemExit("Career number labels still present")
          if 'Deutschlandweit' not in s:
              raise SystemExit("Deutschlandweit marker missing")

          p.write_text(s, encoding="utf-8")

          for legal_name in ("impressum.html", "datenschutz.html"):
              lp = Path(legal_name)
              legal = lp.read_text(encoding="utf-8")
              legal = replace_once(legal, 'src="assets/logo.svg"', 'src="assets/logo.webp"', f'{legal_name} real logo')
              legal = legal.replace('.logo{width:228px}', '.logo{width:228px;height:auto;object-fit:contain}', 1)
              legal = legal.replace('.logo{width:200px}', '.logo{width:200px;height:auto;object-fit:contain}', 1)
              lp.write_text(legal, encoding="utf-8")
          PY

      - name: Verify RN premium build
        run: |
          test -f rn_hero_final.png
          test -f assets/logo.webp
          test -f assets/premium.css
          grep -q 'src="rn_hero_final.png"' index.html
          grep -q 'src="assets/logo.webp"' index.html
          grep -q 'href="assets/premium.css"' index.html
          grep -q 'Projekt anfragen' index.html
          grep -q 'Deutschlandweit' index.html
          ! grep -q 'Stelle 01' index.html
          ! grep -q 'Stelle 02' index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
