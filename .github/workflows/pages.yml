name: Deploy RN Transporte to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build RN multipage site
        run: python build.py

      - name: Apply RN postbuild refinements
        run: python postbuild.py

      - name: Add Kies and Holz services
        run: python kies_image.py

      - name: Refine company page
        run: python company_page.py

      - name: Finetune homepage
        run: python home_finetune.py

      - name: Add homepage email contact
        run: python hero_email.py

      - name: Build references page
        run: python references_page.py

      - name: Apply sitewide premium pass
        run: python premium_pass.py

      - name: Apply visible premium wow
        run: python wow_pass.py

      - name: Apply premium finish
        run: python premium_finish.py

      - name: Finalize direct contact page
        run: python contact_finish.py

      - name: Apply SEO finish
        run: python .github/seo_finish.py

      - name: Finalize regions, services and public URLs
        run: python .github/regional_seo.py

      - name: Verify public RN site
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "index.html",
              "leistungen.html",
              "referenzen.html",
              "unternehmen.html",
              "karriere.html",
              "kontakt.html",
              "betonpumpendienst.html",
              "frischbetontransporte.html",
              "kiestransporte.html",
              "betonlogistik-paderborn-salzkotten.html",
              "betonlogistik-bielefeld-owl.html",
              "betonlogistik-guetersloh-lippstadt-soest.html",
              "betonlogistik-hoexter-warburg.html",
              "betonlogistik-kassel-nordhessen.html",
              "betonlogistik-suedniedersachsen.html",
              "impressum.html",
              "datenschutz.html",
              "robots.txt",
              "sitemap.xml",
              "rn_hero_final.png",
              "assets/logo.webp",
              "assets/premium.css",
              "assets/favicon-rn.svg",
              "assets/rn-social-preview.jpg",
              "assets/leistungen/betonpumpendienst.png",
              "assets/leistungen/frischbetontransport.png",
              "assets/leistungen/Kiestransporte.png",
              "assets/leistungen/Baustelleneinsatz.png",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"Missing RN build files: {missing}")

          if Path("leistungen/index.html").exists():
              raise SystemExit("Obsolete leistungen/index.html must not exist")

          old_host = "dennis-glaser-coder.github.io/rn-transporte"
          for path in Path(".").glob("*.html"):
              text = path.read_text(encoding="utf-8")
              if old_host in text:
                  raise SystemExit(f"Old GitHub Pages host remains in {path}")

          index = Path("index.html").read_text(encoding="utf-8")
          for token in (
              'src="rn_hero_final.png"',
              'href="referenzen.html">Referenzen</a>',
              'id="rn-mobile-menu-fix"',
              'id="rn-premium-finish"',
              'Betonpumpendienst, Frischbeton-, Kies- und Holztransporte.',
          ):
              if token not in index:
                  raise SystemExit(f"Homepage verification failed: {token}")

          services = Path("leistungen.html").read_text(encoding="utf-8")
          for token in (
              'id="rn-service-editorial-style"',
              'id="rn-kies-image-style"',
              'id="rn-regional-focus"',
              'id="holztransporte"',
              '<h2>Holztransporte</h2>',
              'Paderborn / Salzkotten',
              'Bielefeld / Gütersloh',
              'Lippstadt / Soest / Geseke',
              'Höxter / Warburg',
              'Kassel / Nordhessen',
              'Südniedersachsen',
              'href="/betonlogistik-paderborn-salzkotten.html"',
              'href="/betonlogistik-guetersloh-lippstadt-soest.html"',
          ):
              if token not in services:
                  raise SystemExit(f"Services verification failed: {token}")
          for stale in ('Bielefeld / OWL', 'Gütersloh / Lippstadt / Soest'):
              if stale in services:
                  raise SystemExit(f"Stale regional label remains: {stale}")

          region_expectations = {
              "betonlogistik-paderborn-salzkotten.html": "Betonlogistik für Paderborn und den Kreis.",
              "betonlogistik-bielefeld-owl.html": "Betonlogistik für Bielefeld und Gütersloh.",
              "betonlogistik-guetersloh-lippstadt-soest.html": "Betonlogistik für Lippstadt, Soest und Geseke.",
              "betonlogistik-hoexter-warburg.html": "Betonlogistik für Höxter und Warburg.",
              "betonlogistik-kassel-nordhessen.html": "Betonlogistik für Kassel und Nordhessen.",
              "betonlogistik-suedniedersachsen.html": "Betonlogistik für Südniedersachsen.",
          }
          for filename, hero in region_expectations.items():
              text = Path(filename).read_text(encoding="utf-8")
              for token in (
                  hero,
                  'id="rn-regional-page"',
                  'Rund 150 km um Salzkotten',
                  'Deutschlandweit nach Abstimmung',
                  '"@type":"Service"',
                  '"@type":"BreadcrumbList"',
                  'href="/leistungen.html#holztransporte">Holztransporte</a>',
              ):
                  if token not in text:
                      raise SystemExit(f"Regional page verification failed in {filename}: {token}")

          company = Path("unternehmen.html").read_text(encoding="utf-8")
          for token in ('Seit 2010 steht RN Transporte', 'Holztransporte', 'Kontakt aufnehmen →'):
              if token not in company:
                  raise SystemExit(f"Company page verification failed: {token}")

          career = Path("karriere.html").read_text(encoding="utf-8")
          for token in ('Pumpenfahrer / Betonpumpenmaschinist', '"@type":"JobPosting"', '"employmentType":"FULL_TIME"'):
              if token not in career:
                  raise SystemExit(f"Career verification failed: {token}")

          contact = Path("kontakt.html").read_text(encoding="utf-8")
          for token in ('mailto:ntorwesten@web.de', '0173 72 75 165', 'Lohweg 55a'):
              if token not in contact:
                  raise SystemExit(f"Contact verification failed: {token}")

          robots = Path("robots.txt").read_text(encoding="utf-8")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          if "https://rn-transporte.de/sitemap.xml" not in robots:
              raise SystemExit("Production sitemap URL missing in robots.txt")
          if "https://rn-transporte.de/betonlogistik-paderborn-salzkotten.html" not in sitemap:
              raise SystemExit("Production regional URLs missing in sitemap.xml")
          if old_host in robots or old_host in sitemap:
              raise SystemExit("Old GitHub Pages host remains in robots/sitemap")

          legal = Path("impressum.html").read_text(encoding="utf-8")
          for token in ('DE 270004353', 'HRB 9694', 'Amtsgericht Paderborn'):
              if token not in legal:
                  raise SystemExit(f"Legal verification failed: {token}")

          print("RN public-site verification passed")
          PY

      - name: Prepare clean public artifact
        run: |
          sed -i 's/RN Torwesten Transporte · Salzkotten-Niederntudorf/RN Torwesten Transporte · Salzkotten/g' impressum.html datenschutz.html

          rm -rf .github leistungen
          rm -f README.md build.py postbuild.py kies_image.py company_page.py home_finetune.py hero_email.py references_page.py premium_pass.py wow_pass.py premium_finish.py contact_finish.py
          rm -f assets/__upload_test.txt assets/favicon.svg assets/logo.svg assets/rn-hero.svg assets/rn-hero.webp
          rm -rf assets/hero assets/hero-final assets/hero-final12 assets/hero-hq assets/hero-recovered assets/rn-hero-build assets/rn-hero-clean

          test -f index.html
          test -f leistungen.html
          test -f referenzen.html
          test -f unternehmen.html
          test -f karriere.html
          test -f kontakt.html
          test -f betonpumpendienst.html
          test -f frischbetontransporte.html
          test -f kiestransporte.html
          test -f betonlogistik-paderborn-salzkotten.html
          test -f betonlogistik-bielefeld-owl.html
          test -f betonlogistik-guetersloh-lippstadt-soest.html
          test -f betonlogistik-hoexter-warburg.html
          test -f betonlogistik-kassel-nordhessen.html
          test -f betonlogistik-suedniedersachsen.html
          test -f impressum.html
          test -f datenschutz.html
          test ! -e leistungen/index.html
          ! grep -q 'Salzkotten-Niederntudorf' impressum.html
          ! grep -q 'Salzkotten-Niederntudorf' datenschutz.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
